<!doctype html>
<meta charset="utf-8" />
<title>StoneQR Open Graph cards</title>
<style>
	/* The @font-face descriptor is how the canvas gets Fraunces' optical size and softness:
	   ctx.font has no way to express font-variation-settings. */
	@font-face {
		font-family: 'OG Display';
		src: url('/display.woff2') format('woff2-variations');
		font-weight: 500;
		font-variation-settings: 'opsz' 72, 'SOFT' 30, 'WONK' 0;
	}
	@font-face {
		font-family: 'OG Sans';
		src: url('/sans.woff2') format('woff2-variations');
		font-weight: 400;
	}
	@font-face {
		font-family: 'OG Mono';
		src: url('/mono.woff2') format('woff2-variations');
		font-weight: 500;
	}
	body {
		margin: 0;
		padding: 24px;
		background: #1b1917;
		color: #f4f0e8;
		font: 14px ui-monospace, monospace;
		display: grid;
		gap: 16px;
		justify-items: center;
	}
	canvas {
		width: 600px;
		height: 315px;
		box-shadow: 0 2px 12px #0008;
	}
</style>
<body>
	<p id="status">Drawing…</p>
	<script type="module">
		import { CARD, drawCard } from '/card.js';

		const status = document.getElementById('status');
		const cards = await fetch('/cards.json').then((r) => r.json());
		await Promise.all(
			['OG Display', 'OG Sans', 'OG Mono'].map((f) => document.fonts.load(`500 52px "${f}"`))
		);
		await document.fonts.ready;

		for (const card of cards) {
			const canvas = document.createElement('canvas');
			canvas.width = CARD.width;
			canvas.height = CARD.height;
			drawCard(canvas.getContext('2d'), card);
			document.body.append(canvas);
			const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
			await fetch(`/save/${card.slug}`, { method: 'POST', body: blob });
			status.textContent = `Wrote ${card.slug}.png`;
		}
		status.textContent = `Done: ${cards.length} images written. You can close this tab.`;
	</script>
</body>
